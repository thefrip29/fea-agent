[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fea-agent"
version = "0.1.0"
description = "LLM-driven agent for CAE/FEA simulations with hand-written physics verifiers"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["verifiers", "solutions"]
